<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #18212b; background: #f3f6f8; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 760px); padding: clamp(24px, 6vw, 56px); text-align: center; background: white; border-radius: 24px; box-shadow: 0 18px 60px #19304718; }
    img { width: min(100%, 320px); aspect-ratio: 1; object-fit: cover; border-radius: 50%; border: 6px solid #e8eef3; }
    h1 { margin: 28px 0 8px; font-size: clamp(2rem, 7vw, 3.5rem); }
    p { margin: 0; color: #5c6874; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <img src="my-picture.png" alt="My picture">
    <h1>*</h1>
    <p>**</p>
  </main>
</body>
</html>
